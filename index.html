<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timplado PH - Filipino Food Showcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-overlay"></div>
  <header class="main-header">
    <div class="header-content">
      <a href="#/" class="logo-link">
        <img class="brand-logo" src="public/logo.png" alt="Timplado PH Logo" />
      </a>
      <div class="header-actions">
        <a href="#/cart" class="cart-link" id="cart-link">
          <span class="cart-icon">🛒</span>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>
  <main>
    <section class="content" id="app-content">
      <!-- Content will be dynamically loaded here -->
    </section>
  </main>
  
  <!-- Order Modal -->
  <div id="order-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="Router.closeOrderModal()">&times;</span>
      <div id="modal-body">
        <!-- Modal content will be dynamically loaded here -->
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
